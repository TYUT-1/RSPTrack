# RSPTrack: TVPM + Layer-wise Rectified Sparse Attention (LRSA).
DATA:
  MAX_SAMPLE_INTERVAL: 400
  ALLOW_INVISIBLE: 0.0
  ALLOW_DISTRACTOR: 0.0
  ALLOW_TEXTLOCAL_RAND: 0.0
  ONLY_TEXT_DATA: true
  CLS_EPOCH: 0
  MULTI_MODAL_LANGUAGE: true
  MULTI_MODAL_VISION: false
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 3.5
    FACTOR: 4.0
    SCALE_JITTER: 0.5
    SIZE: 224
    NUMBER: 1
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 112
    NUMBER: 1
  TRAIN:
    DATASETS_NAME:
    - LASOT
    - TNL2K_train
    - GOT10K_vottrain
    - COCO17
    - TRACKINGNET
    DATASETS_RATIO:
    - 1
    - 1
    - 1
    - 1
    - 1
    SAMPLE_PER_EPOCH: 60000
  USE_NLP:
    TNL2K: true
    LASOT: false
    GOT10K: false
    COCO: false
    TRACKINGNET: false
    OTB99: false
MODEL:
  ENCODER:
    TYPE: fastitpnb
    STRIDE: 16
    PRETRAIN_TYPE: pretrained/itpn/fast_itpn_base_clipl_e1600.pt
    PATCHEMBED_INIT: halfcopy
    DROP_PATH: 0.1
    TOKEN_TYPE_INDICATE: true
    TEXT_INPUT_MODE: concat
    CLASS_TOKEN: true
    CLASS_POS: start
    TVPM:
      ENABLED: true
      HIDDEN_DIM: 512
      ROLE_SCALE: 0.5
    LRSA:
      ENABLED: true
      BLOCK_SIZE: 16
      ACTIVE_RATIO: 0.5
      MIN_BLOCKS: 4
      LOCAL_BLOCKS: 1
      START_LAYER: 0
      RECTIFY_INTERVAL: 4
      PROTECT_CLS: true
      PROTECT_TEXT: true
  TEXT_ENCODER:
    TYPE: ViT-L/14
    USECOOP: false
    NUM_CTX: 8
    FEAT_TYPE: last
    MAX_LEN: 40
    COCOOP_TYPE: search
  DECODER:
    TYPE: CENTER
    NUM_CHANNELS: 256
    CONV_TYPE: normal
    XAVIER_INIT: true
  TASK_DECODER:
    NUM_CHANNELS: 256
    FEATURE_TYPE: average_local
  CLS_NUM: 3
TRAIN:
  TYPE: text_frozen
  ENCODER_MULTIPLIER: 0.1
  COOP_MULTIPLIER: 1
  BATCH_SIZE: 32
  EPOCH: 200
  GRAD_CLIP_NORM: 0.1
  LR: 0.0001
  LR_DROP_EPOCH: 150
  NUM_WORKER: 8
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  WEIGHT_DECAY: 0.0001
  TEXT_WEIGHT: 0.0
  TASK_CE_WEIGHT: 0.0
  CLIP_WEIGHT: 0.0
  CLIP_FEAT_STAGE: cross
  CLIP_WITH: cls
  CLIP_TEMP_LEARN: true
TEST:
  EPOCH: 200
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 224
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 112
  WINDOW: true
  MULTI_MODAL_VISION:
    DEFAULT: false
  MULTI_MODAL_LANGUAGE:
    DEFAULT: true
  USE_NLP:
    DEFAULT: false
    LASOT: false
    TNL2K: true
    OTB99_LANG: true
